# Render Blueprint — provisiona banco Postgres + web service automaticamente.
# No painel do Render: New > Blueprint > conecte este repositório.
services:
  - type: web
    name: quintoandar-prudential
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quintoandar-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"

databases:
  - name: quintoandar-db
    plan: free
    databaseName: quintoandar
    user: quintoandar
